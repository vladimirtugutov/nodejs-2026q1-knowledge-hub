services:
  app:
    build: .
    container_name: knowledge-hub-app
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    networks:
      - knowledge-hub-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_:/var/lib/postgresql/data
    networks:
      - knowledge-hub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vectordb:
    image: qdrant/qdrant:latest
    container_name: knowledge-hub-vectordb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_:/qdrant/storage
    networks:
      - knowledge-hub-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: knowledge-hub-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - knowledge-hub-network
    profiles:
      - debug
    restart: unless-stopped

volumes:
  postgres_:
  qdrant_:

networks:
  knowledge-hub-network:
    driver: bridge
